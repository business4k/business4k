<script>
document.addEventListener("DOMContentLoaded", function () {

  /* =========================
     OPEN / CLOSE SIDE MENU
     ========================= */

  const menuToggle = document.getElementById("menuToggle");
  const menuClose = document.getElementById("menuClose");
  const sideMenu = document.getElementById("sideMenu");


  if (menuToggle && sideMenu) {

    menuToggle.addEventListener("click", function () {
      sideMenu.classList.add("open");
      menuToggle.setAttribute("aria-expanded", "true");
    });

  }


  if (menuClose && sideMenu) {

    menuClose.addEventListener("click", function () {
      sideMenu.classList.remove("open");
      menuToggle.setAttribute("aria-expanded", "false");
    });

  }


  /* =========================
     SUBMENUS
     ========================= */

  const menuParents = document.querySelectorAll(".menu-parent");


  menuParents.forEach(function (parent) {

    parent.addEventListener("click", function () {

      const menuName = this.getAttribute("data-menu");

      const submenu =
        document.getElementById("submenu-" + menuName);

      if (!submenu) return;


      const isOpen =
        submenu.classList.contains("active");


      /* Close every submenu */

      document
        .querySelectorAll(".submenu")
        .forEach(function (item) {

          item.classList.remove("active");

        });

document
  .querySelectorAll(".menu-parent")
  .forEach(function (item) {

    item.classList.remove("menu-open");

  });
      /* Reset arrows */

      document
        .querySelectorAll(".menu-parent .arrow")
        .forEach(function (arrow) {

          arrow.textContent = "›";

        });


      /* Open selected submenu */

      if (!isOpen) {

        submenu.classList.add("active");

        const arrow =
        this.querySelector(".arrow");
        
        
        this.classList.add("menu-open");
      
        if (arrow) {
          arrow.textContent = "⌄";
        }

      }

    });

  });

});
                                </script>
