---
layout: default
---
<div class="article-page">

  <div class="article-category">
    {{ page.category | default: "Business" }}
  </div>

  <h1 class="article-title">
    {{ page.title }}
  </h1>

  <div class="article-meta">
    {{ page.date | date: "%B %d, %Y" }}
  </div>

  <div class="article-content">
    {{ content }}
  </div>

</div>
